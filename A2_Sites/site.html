<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Days Out in Herts</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>
    <script src="https://stivb.github.io/wpimport/A2_Sites/loader.js"></script>
    <link rel="stylesheet" href="starter.css" />
    <style>
      .card img {
        display: block;
        width: 100%;
        max-height: 200px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 12px;
      }

      .card .badges {
        margin-bottom: 8px;
      }

      .term-menus {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }

      .term-menu {
        position: relative;
      }

      .term-menu summary {
        cursor: pointer;
      }

      .term-menu-list {
        position: absolute;
        z-index: 1;
        min-width: 220px;
        max-height: 50vh;
        overflow-y: auto;
        background: white;
        border: 1px solid #dfe7d7;
        border-radius: 8px;
        padding: 6px;
      }

      .term-menu-list button {
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        padding: 8px;
        text-align: left;
        cursor: pointer;
      }

      .term-menu-list button:hover,
      .term-menu-list button:focus,
      .term-menu-list button[aria-pressed="true"] {
        background: #eaf5ee;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Days Out in Herts</h1>
      <div class="subtitle">Free and family-friendly things to do outdoors around Hertfordshire, plus a few local fitness options.</div>
      <div class="status-line" id="status-line">Loading...</div>

      <div class="pill-row" id="filters"></div>
      <nav class="term-menus" id="term-menus" aria-label="Browse topics"></nav>

      <div id="content" class="grid"></div>
    </main>

    <script>
      const state = { db: null, siteFilter: null, termFilter: null };

      function rowsToObjects(result) {
        if (!result || !result[0]) return [];
        const { columns, values } = result[0];
        return values.map((row) => {
          const obj = {};
          columns.forEach((col, idx) => { obj[col] = row[idx]; });
          return obj;
        });
      }

      // Pulls the first <img src="..."> out of a post's raw content, if any,
      // so cards get a photo without needing to render the full WordPress markup.
      function firstImageSrc(html) {
        if (!html) return null;
        const match = html.match(/<img\b[^>]*\bsrc="([^"]+)"/i);
        return match ? match[1] : null;
      }

      function buildQuery() {
        const clauses = ['p.isPublic = 1'];
        const params = [];
        if (state.siteFilter) {
          clauses.push('p.site_id = ?');
          params.push(state.siteFilter);
        }
        if (state.termFilter) {
          clauses.push(`p.id IN (
            SELECT pt.post_id FROM post_terms pt
            JOIN terms t ON t.term_id = pt.term_id AND t.site_id = pt.site_id AND t.kind = pt.kind
            WHERE pt.site_id = p.site_id AND LOWER(t.name) = LOWER(?)
          )`);
          params.push(state.termFilter);
        }
        const sql = `
          SELECT p.site_id, p.id, p.title, p.date, p.excerpt, p.content, p.link, s.title AS site_title
          FROM posts p
          JOIN sites s ON s.site_id = p.site_id
          WHERE ${clauses.join(' AND ')}
          ORDER BY p.date DESC
        `;
        return { sql, params };
      }

      function renderFilters(sites, terms) {
        const filtersEl = document.getElementById('filters');
        const siteButtons = sites.map((site) => {
          const active = state.siteFilter === site.site_id ? 'active' : '';
          return `<button type="button" class="pill site ${active}" data-site="${Loader.escapeHtml(site.site_id)}" aria-pressed="${state.siteFilter === site.site_id}">${Loader.escapeHtml(site.title)}</button>`;
        });
        const allSitesActive = state.siteFilter === null ? 'active' : '';

        filtersEl.innerHTML = `
          <button type="button" class="pill site ${allSitesActive}" data-site="" aria-pressed="${state.siteFilter === null}">All sites</button>
          ${siteButtons.join('')}
          <button type="button" class="pill ${state.termFilter === null ? 'active' : ''}" id="all-terms" aria-pressed="${state.termFilter === null}">All topics</button>
        `;

        filtersEl.querySelectorAll('[data-site]').forEach((el) => {
          el.addEventListener('click', () => {
            state.siteFilter = el.dataset.site || null;
            renderFilters(sites, terms);
            renderPosts();
          });
        });
        document.getElementById('all-terms').addEventListener('click', () => {
          state.termFilter = null;
          renderFilters(sites, terms);
          renderPosts();
        });

        const groups = new Map();
        terms.forEach((term) => {
          if (!groups.has(term.tag_group_name)) groups.set(term.tag_group_name, []);
          groups.get(term.tag_group_name).push(term);
        });
        const menusEl = document.getElementById('term-menus');
        menusEl.innerHTML = Array.from(groups, ([name, groupTerms]) => `
          <details class="term-menu">
            <summary class="pill">${Loader.escapeHtml(name)}</summary>
            <div class="term-menu-list">
              ${groupTerms.map((term) => `
                <button type="button" data-term="${Loader.escapeHtml(term.name)}" aria-pressed="${state.termFilter === term.name}">${Loader.escapeHtml(term.name)} (${term.count})</button>
              `).join('')}
            </div>
          </details>
        `).join('');
        menusEl.querySelectorAll('[data-term]').forEach((el) => {
          el.addEventListener('click', () => {
            state.termFilter = el.dataset.term;
            renderFilters(sites, terms);
            renderPosts();
          });
        });
      }

      function renderPosts() {
        const contentEl = document.getElementById('content');
        const { sql, params } = buildQuery();
        const rows = rowsToObjects(state.db.exec(sql, params));

        if (!rows.length) {
          contentEl.innerHTML = '<p>No posts match this filter.</p>';
          return;
        }

        const termHeading = state.termFilter
          ? `<h2 class="term-heading">${Loader.escapeHtml(state.termFilter)}</h2>`
          : '';

        contentEl.innerHTML = termHeading + rows.map((row) => {
          const image = firstImageSrc(row.content);
          const description = row.excerpt && row.excerpt.trim()
            ? row.excerpt
            : (row.content || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 160);

          return `
          
            <article class="card">
              ${image ? `<img src="${Loader.escapeHtml(image)}" alt="" loading="lazy" />` : ''}
              <div class="badges"><span class="pill site">${Loader.escapeHtml(row.site_title)}</span></div>
              <h2>${Loader.escapeHtml(row.title || '(untitled)')}</h2>
              <div class="meta">${Loader.escapeHtml(Loader.formatDate(row.date))}</div>
              <p>${Loader.escapeHtml(description)}</p>
            </article>
          `;
        }).join('');
      }

      async function startApp() {
        const statusEl = document.getElementById('status-line');
        try {
          const { db, curation } = await Loader.initializeDatabase();
          state.db = db;

          if (curation.error) {
            statusEl.textContent = `Loaded, but curation.sql failed to run: ${curation.error}`;
            statusEl.classList.add('error');
          } else {
            statusEl.textContent = curation.applied
              ? 'Loaded site-cache.json and applied curation.sql.'
              : 'Loaded site-cache.json (no curation.sql applied).';
          }

          const sites = rowsToObjects(db.exec('SELECT site_id, title FROM sites ORDER BY site_order'));
          const terms = curation.applied ? rowsToObjects(db.exec(`
            SELECT tg.tag_group_name, MIN(t.name) AS name,
                   COUNT(DISTINCT pt.site_id || ':' || pt.post_id) AS count
            FROM term_group tg
            JOIN terms t ON t.site_id = tg.site_id AND t.term_id = tg.term_id
            JOIN post_terms pt ON pt.term_id = t.term_id AND pt.site_id = t.site_id AND pt.kind = t.kind
            JOIN posts p ON p.id = pt.post_id AND p.site_id = pt.site_id
            WHERE p.isPublic = 1
            GROUP BY tg.tag_group_name, LOWER(t.name)
            ORDER BY tg.tag_group_name, LOWER(t.name)
          `)) : [];
          if (!curation.applied && !curation.error) {
            statusEl.textContent = 'Loaded site-cache.json, but curation.sql was not applied; topic menus are unavailable.';
            statusEl.classList.add('error');
          }

          renderFilters(sites, terms);
          renderPosts();
        } catch (error) {
          statusEl.textContent = `Failed to load data: ${error.message}`;
          statusEl.classList.add('error');
        }
      }

      startApp();
    </script>
  </body>
</html>
